name: Build S24 Ultra Port for A52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Setup Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full python3 python3-pip android-sdk-libsparse-utils git lz4 cpio wget zip zstd file
          python3 -m pip install --break-system-packages git+https://github.com/nethunteros/samloader.git || python3 -m pip install git+https://github.com/nethunteros/samloader.git

      - name: Download Trees & Base ROM
        run: |
          mkdir -p work/base_s24 work/vendor_a52q
          cd work
          git clone https://github.com/crdroidandroid/android_device_samsung_a52q.git device/samsung/a52q
          git clone https://github.com/TheMuppets/proprietary_vendor_samsung_a52q.git -b lineage-21 vendor/samsung/a52q

      - name: Download S24 Ultra Official Firmware & Extract
        run: |
          cd work/base_s24
          
          echo "==> Ներբեռնվում է S24 Ultra (SM-S928B) ֆիրմվերը Samsung-ից..."
          samloader -m SM-S928B -r EUX download -o firmware.zip || \
          samloader -m SM-S928B -r INS download -o firmware.zip || \
          samloader -m SM-S928B -r KOO download -o firmware.zip
          
          echo "==> Ապասեղմում ենք firmware.zip-ը..."
          unzip firmware.zip
          
          echo "==> Գտնում ենք AP ֆայլը..."
          AP_FILE=$(ls AP_*.tar.md5 | head -n 1)
          
          echo "==> Extracting $AP_FILE using 7z..."
          7z x "$AP_FILE" *.lz4 *.img -y || true

          echo "==> Decompressing LZ4 images..."
          for f in *.lz4; do
              if [ -f "$f" ]; then
                  echo "Decompressing $f..."
                  lz4 -d -f "$f" "${f%.lz4}"
                  rm -f "$f"
              fi
          done

          echo "==> Դուրս բերված ֆայլերը work/base_s24-ում․"
          ls -lh

      - name: Execute Port Script
        run: |
          chmod +x scripts/port.sh
          bash scripts/port.sh

      - name: Verify Out Directory
        run: |
          echo "Checking out/ directory contents:"
          ls -lah out/ || echo "out/ directory is missing or empty"

      - name: Upload Port ROM Zip
        uses: actions/upload-artifact@v4
        with:
          name: OneUI8.5_S24Ultra_Port_A52q
          path: |
            out/*.zip
            **/out/*.zip
            work/*.zip
          if-no-files-found: ignore
