name: Build S24 Ultra OneUI Port for A52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean
          df -h

      - name: Setup Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full python3 python3-pip android-sdk-libsparse-utils git lz4 cpio wget zip zstd file python3-requests python3-crypto python3-tqdm

      - name: Download Base super.img from Google Drive
        run: |
          mkdir -p work/base_s24
          cd work/base_s24
          
          echo "==> Տեղադրում ենք gdown..."
          python3 -m pip install --break-system-packages gdown || python3 -m pip install gdown
          
          echo "==> Ներբեռնում ենք super.img-ն Google Drive-ից..."
          gdown --id 11CRFJZDBdmSyexLBg6HMgMcoCxDEUFgF -O super.img --fuzzy
          
          echo "==> Ստուգում ենք ներբեռնված super.img-ի չափը..."
          ls -lh super.img

      - name: Download Device Trees
        run: |
          mkdir -p work/vendor_a52q
          cd work
          echo "==> Կլոնավորում ենք A52q-ի տրիները..."
          git clone https://github.com/crdroidandroid/android_device_samsung_a52q.git device/samsung/a52q || true
          git clone https://github.com/TheMuppets/proprietary_vendor_samsung_a52q.git -b lineage-21 vendor/samsung/a52q || true

      - name: Execute Port Script
        run: |
          chmod +x scripts/port.sh
          bash scripts/port.sh

      - name: Verify Out Directory
        run: |
          echo "Checking out/ directory contents:"
          ls -lah out/ || echo "out/ directory is missing or empty"

      - name: Upload Port ROM Zip
        uses: actions/upload-artifact@v4
        with:
          name: OneUI_S24Ultra_Port_A52q
          path: |
            out/*.zip
            **/out/*.zip
            work/*.zip
          if-no-files-found: ignore
