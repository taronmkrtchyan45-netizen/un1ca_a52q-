name: Build UN1CA ROM for A52 4G

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Clone and Setup UN1CA
        run: |
          git clone --recurse-submodules https://github.com/BlackMesa123/UN1CA.git unica_source
          cd unica_source
          # Ստուգում ենք կամ կանչում ճիշտ բաշխման սկրիպտը
          if [ -f "buildenv.sh" ]; then
            chmod +x buildenv.sh
            ./buildenv.sh a52q
          else
            echo "buildenv.sh not found in root, checking subfolders..."
            find . -name "buildenv.sh"
          fi
