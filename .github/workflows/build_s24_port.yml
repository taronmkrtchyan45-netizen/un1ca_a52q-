name: Build S24 Ultra Port for A52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Setup Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full python3 android-sdk-libsparse-utils git

      - name: Download Trees & Base ROM
        run: |
          mkdir -p work
          cd work
          # A52q Vendor & Kernel trees
          git clone https://github.com/crdroidandroid/android_device_samsung_a52q.git -b 14.0 device/samsung/a52q
          git clone https://github.com/TheMuppets/proprietary_vendor_samsung_a52q.git -b lineage-21 vendor/samsung/a52q

      - name: Execute Port Script
        run: |
          chmod +x scripts/port.sh
          bash scripts/port.sh
