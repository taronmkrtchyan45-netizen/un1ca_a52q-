name: Build S24 Ultra Port for A52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Setup Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full python3 android-sdk-libsparse-utils git lz4 cpio wget zip zstd file

      - name: Download Trees & Base ROM
        run: |
          mkdir -p work/base_s24 work/vendor_a52q
          cd work
          git clone https://github.com/crdroidandroid/android_device_samsung_a52q.git device/samsung/a52q
          git clone https://github.com/TheMuppets/proprietary_vendor_samsung_a52q.git -b lineage-21 vendor/samsung/a52q

      - name: Download S24 Ultra Firmware & Extract
        run: |
          cd work/base_s24
          
          FIRMWARE_URL="https://sf04."
          
          echo "==> Ներբեռնվում է AP ֆայլը..."
          aria2c -x 16 -s 16 --max-connection-per-server=16 "$FIRMWARE_URL" -o ap_file.tar.md5
          
          echo "==> Օգտագործում ենք Python՝ system կամ super ֆայլերը անխափան դուրս բերելու համար..."
          python3 - << 'EOF'
          import tarfile
          import os

          tar_path = "ap_file.tar.md5"
          target_files = ["system.img.lz4", "super.img.lz4", "system.img", "super.img"]

          print("==> Կարդացվում է արխիվը Python-ի միջոցով...")
          try:
              with tarfile.open(tar_path, "r:*") as tar:
                  for member in tar.getmembers():
                      basename = os.path.basename(member.name)
                      if basename in target_files:
                          print(f"==> Գտնվեց և արդյունահանվում է: {basename}")
                          tar.extract(member, path=".")
                          if member.name != basename and os.path.exists(member.name):
                              os.rename(member.name, basename)
                          break
          except Exception as e:
              print(f"❌ Զգուշացում Python tar-ի ընթացքում: {e}")
          EOF

          # Եթե ուղղակիորեն չգտնվեց, փորձում ենք 7z-ով
          if [ ! -f "system.img.lz4" ] && [ ! -f "super.img.lz4" ] && [ ! -f "system.img" ] && [ ! -f "super.img" ]; then
              echo "==> Գործարկվում է 7z պահեստային եղանակը..."
              7z e -so ap_file.tar.md5 system.img.lz4 > system.img.lz4 2>/dev/null || true
              7z e -so ap_file.tar.md5 super.img.lz4 > super.img.lz4 2>/dev/null || true
          fi

          echo "==> Ապասեղմվում են ֆայլերը (եթե սեղմված են)..."
          if [ -f "super.img.lz4" ]; then
              unlz4 super.img.lz4 super.img || lz4 -d super.img.lz4 super.img
          elif [ -f "system.img.lz4" ]; then
              unlz4 system.img.lz4 system.img || lz4 -d system.img.lz4 system.img
          elif [ -f "system.img" ] || [ -f "super.img" ]; then
              echo "==> Համակարգային ֆայլը պատրաստ է։"
          else
              echo "❌ Սխալ: Համակարգային ֆայլը հնարավոր չեղավ գտնել արխիվից!"
              exit 1
          fi
          
          ls -lh system.img super.img 2>/dev/null || true

      - name: Execute Port Script
        run: |
          chmod +x scripts/port.sh
          bash scripts/port.sh

      - name: Verify Out Directory
        run: |
          echo "Checking out/ directory contents:"
          ls -lah out/ || echo "out/ directory is missing or empty"

      - name: Upload Port ROM Zip
        uses: actions/upload-artifact@v4
        with:
          name: OneUI8.5_S24Ultra_Port_A52q
          path: |
            out/*.zip
            **/out/*.zip
            work/*.zip
          if-no-files-found: ignore
