name: Build A52q One UI ROM

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up environment and dependencies
        run: |
          sudo apt update
          sudo apt install -yq aria2 zip unzip ccache brotli img2simg

      - name: Run Build Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A52q-OneUI-ROM
          path: out/*.zip
