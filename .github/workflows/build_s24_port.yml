name: Build S24 Ultra Port for A52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Setup Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full python3 android-sdk-libsparse-utils git lz4 cpio wget

      - name: Download Trees & Base ROM
        run: |
          mkdir -p work/base_s24 work/vendor_a52q
          cd work
          git clone https://github.com/crdroidandroid/android_device_samsung_a52q.git device/samsung/a52q
          git clone https://github.com/TheMuppets/proprietary_vendor_samsung_a52q.git -b lineage-21 vendor/samsung/a52q

      - name: Download S24 Ultra Firmware
        run: |
          cd work/base_s24
          
          # Տեղադրիր S24 Ultra-ի AP փաթեթի ուղիղ ներբեռնման հղումը (Direct Link)
          FIRMWARE_URL="https://example.com/path/to/s24_ultra_firmware.zip"
          
          echo "==> Ներբեռնվում է ֆիրմվերը aria2c-ի միջոցով..."
          aria2c -x 16 -s 16 --max-connection-per-server=16 "$FIRMWARE_URL" -o firmware.zip
          
          echo "==> Փնտրվում և բացվում է AP փաթեթը..."
          unzip -q firmware.zip AP_*.tar.md5 || unzip -q firmware.zip *.tar.md5 || true
          
          echo "==> Դուրս է բերվում system.img.lz4-ը..."
          tar -f AP_*.tar.md5 -x system.img.lz4 2>/dev/null || tar -f *.tar -x system.img.lz4 2>/dev/null || true

      - name: Execute Port Script
        run: |
          chmod +x scripts/port.sh
          bash scripts/port.sh

      - name: Verify Out Directory
        run: |
          echo "Checking out/ directory contents:"
          ls -lah out/ || echo "out/ directory is missing or empty"

      - name: Upload Port ROM Zip
        uses: actions/upload-artifact@v4
        with:
          name: OneUI8.5_S24Ultra_Port_A52q
          path: |
            out/*.zip
            **/out/*.zip
            work/*.zip
          if-no-files-found: ignore
