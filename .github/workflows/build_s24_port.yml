name: Build S24 Ultra Port for A52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Setup Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full python3 android-sdk-libsparse-utils git lz4 cpio wget zip zstd file

      - name: Download Trees & Base ROM
        run: |
          mkdir -p work/base_s24 work/vendor_a52q
          cd work
          git clone https://github.com/crdroidandroid/android_device_samsung_a52q.git device/samsung/a52q
          git clone https://github.com/TheMuppets/proprietary_vendor_samsung_a52q.git -b lineage-21 vendor/samsung/a52q

      - name: Download S24 Ultra Firmware & Extract
        run: |
          cd work/base_s24
          
          FIRMWARE_URL="https://sf04."
          
          echo "==> Ներբեռնվում է AP ֆայլը..."
          aria2c -x 16 -s 16 --max-connection-per-server=16 "$FIRMWARE_URL" -o ap_file.tar.md5
          
          echo "==> Հեռացվում է MD5 ստուգիչը պոչից tar-ի սխալները բացառելու համար..."
          head -c -32 ap_file.tar.md5 > clean_ap.tar
          
          echo "==> Փնտրում ենք համակարգային ֆայլերը արխիվի ներսում..."
          tar -tf clean_ap.tar | grep -E "system.img|super.img" || true
          
          echo "==> Արդյունահանում ենք ֆայլերը clean_ap.tar-ից..."
          tar -f clean_ap.tar -x system.img.lz4 2>/dev/null || true
          tar -f clean_ap.tar -x super.img.lz4 2>/dev/null || true
          tar -f clean_ap.tar -x system.img 2>/dev/null || true
          tar -f clean_ap.tar -x super.img 2>/dev/null || true
          
          if [ -f "super.img.lz4" ]; then
              unlz4 super.img.lz4 super.img || lz4 -d super.img.lz4 super.img
          elif [ -f "system.img.lz4" ]; then
              unlz4 system.img.lz4 system.img || lz4 -d system.img.lz4 system.img
          elif [ -f "system.img" ] || [ -f "super.img" ]; then
              echo "==> Համակարգային ֆայլը հաջողությամբ դուրս բերվեց առանց սեղմման։"
          else
              echo "❌ Սխալ: Համակարգային img ֆայլ չգտնվեց արխիվից!"
              exit 1
          fi
          
          ls -lh system.img super.img 2>/dev/null || true

      - name: Execute Port Script
        run: |
          chmod +x scripts/port.sh
          bash scripts/port.sh

      - name: Verify Out Directory
        run: |
          echo "Checking out/ directory contents:"
          ls -lah out/ || echo "out/ directory is missing or empty"

      - name: Upload Port ROM Zip
        uses: actions/upload-artifact@v4
        with:
          name: OneUI8.5_S24Ultra_Port_A52q
          path: |
            out/*.zip
            **/out/*.zip
            work/*.zip
          if-no-files-found: ignore
