name: Build UN1CA ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Repo tool
        run: |
          sudo mkdir -p /usr/local/bin
          sudo curl https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Initialize UN1CA manifest
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          repo init -u https://github.com/UN1CA/manifest.git -b main --depth=1

      - name: Sync source code
        run: repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j8

      - name: Clone Device Tree
        run: |
          git clone https://github.com/UN1CA/device_samsung_a52q.git -b 15.0 device/samsung/a52q

      - name: Setup environment and lunch
        run: |
          source build/envsetup.sh
          lunch un1ca_a52q-userdebug

      - name: Start compilation
        run: |
          mka bacon
